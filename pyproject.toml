[build-system]
requires = ["setuptools>=69,<70"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-caching-lab"
version = "0.2.0"
description = "Laboratory for persistent cross-session datastore speculative decoding on Apple Silicon (corpus builders, offline replay, receipts)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "iniconfig==2.3.0",
  "packaging==26.1",
  "pluggy==1.6.0",
  "Pygments==2.20.0",
  "pytest==9.1.1",
  "ruff==0.15.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
